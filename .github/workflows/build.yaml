name: Semantic Link Functions

on: [push]

permissions:
  contents: write          # This is required for actions/checkout@v1
  security-events: write   # To upload sarif files

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
        package: ["geopandas", "holidays", "meteostat", "phonenumbers", "validators"]

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8

      - name: Get Date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache conda
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        env:
          # Increase this value to reset cache if environment.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ steps.get-date.outputs.today }}-${{ hashFiles('environment.yml') }}

      - uses: conda-incubator/setup-miniconda@9f54435e0e72c53962ee863144e47a4b094bfd35 # v2.3.0
        with:
          auto-update-conda: true
          activate-environment: sempy
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          channel-priority: strict

      - name: Install package
        shell: bash -el {0}
        run: |
          conda info
          cd ${{ matrix.package }}
          pip install -e .

      - name: Lint with flake8
        shell: bash -el {0}
        run: |
          cd ${{ matrix.package }}
          flake8 . --count --show-source --statistics

      - name: Test with pytest
        shell: bash -el {0}
        run: |
          cd ${{ matrix.package }}
          pytest -s tests/